                        </div>
                    </div>
                    <div class="control-group">
                        <div class="form-group floating-label-form-group controls">
                            <label>Nickname</label>
                            <input type="text" class="form-control" name="Nickname" placeholder="Nickname" id="Nickname"
                                required>
                        </div>
                    </div>
                    <div class="control-group">
                        <div class="form-group floating-label-form-group controls">

                    <div class="control-group">

                            <input type="text" class="form-control" name="Weibo Home" placeholder="Weibo Home"
                                id="Weibo Home" required>
                        </div>
                    </div>
                    <div class="control-group">
                        <div class="form-group floating-label-form-group controls">
                            <label>Github</label>
                            <input type="text" class="form-control" name="Github" placeholder="Github" id="Github"
                                required>
                        </div>
                    </div>
                    <div class="control-group">
                        <div class="form-group floating-label-form-group controls">
                            <label>Description</label>
                            <textarea rows="4" class="form-control" name="Description" placeholder="Description"
                                id="Description" required></textarea>
                        </div>
                    </div>
                    <div class="form-group mt-4">
