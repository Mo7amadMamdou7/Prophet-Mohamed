  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="assets/main.css">

</head>

<body>

        </ul>
        <ul class="navbar-nav ml-auto nav-search">

      </div>

  </nav>
  <header class="masthead" style="background-image: url('img/bg-contact.jpg')">
    <div class="overlay"></div>
    <div class="container">
      <div class="row">
        <div class="col-lg-8 col-md-10 mx-auto">
          <div class="page-heading">
            <h1>Contact Me</h1> <span class="subheading">Have questions? I have answers.</span>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div class="container">
    <div class="row">
      <div class="col-lg-8 col-md-10 mx-auto">
        <p>Want to get in touch? Fill out the form below to send me a message and I will get back to you as soon as
          possible!</p>
        <form name="sentMessage" id="contactForm" novalidate>
          <div class="control-group">
            <div class="form-group floating-label-form-group controls"> <label>Name</label> <input type="text"
                class="form-control" placeholder="Name" id="name" required
                data-validation-required-message="Please enter your name.">
              <p class="help-block text-danger"></p>
            </div>
          </div>
          <div class="control-group">
            <div class="form-group floating-label-form-group controls"> <label>Email Address</label> <input type="email"
                class="form-control" placeholder="Email Address" id="email" required
                data-validation-required-message="Please enter your email address.">
              <p class="help-block text-danger"></p>
            </div>
          </div>
          <div class="control-group">
            <div class="form-group col-xs-12 floating-label-form-group controls"> <label>Phone Number</label> <input
                type="tel" class="form-control" placeholder="Phone Number" id="phone" required
                data-validation-required-message="Please enter your phone number.">
              <p class="help-block text-danger"></p>
            </div>
          </div>
          <div class="control-group">
            <div class="form-group floating-label-form-group controls"> <label>Message</label><textarea rows="5"
                class="form-control" placeholder="Message" id="message" required
                data-validation-required-message="Please enter a message."></textarea>
              <p class="help-block text-danger"></p>
            </div>
          </div> <br>
          <div id="success"></div>
          <div class="form-group"> <button type="submit" class="btn btn-primary" id="sendMessageButton">Send</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <hr>
  <footer>
    <div class="container">
      <div class="row">
        <div class="col-lg-8 col-md-10 mx-auto">
          <ul class="list-inline text-center">
            <li class="list-inline-item"> <a href="mailto:#"> <span class="fa-stack fa-lg"> <i
                    class="fas fa-circle fa-stack-2x"></i> <i class="far fa-envelope fa-stack-1x fa-inverse"></i>
                </span> </a></li>
            <li class="list-inline-item"> <a href="#"> <span class="fa-stack fa-lg"> <i
                    class="fas fa-circle fa-stack-2x"></i> <i class="fab fa-twitter fa-stack-1x fa-inverse"></i> </span>
              </a></li>
            <li class="list-inline-item"> <a href="#"> <span class="fa-stack fa-lg"> <i
                    class="fas fa-circle fa-stack-2x"></i> <i class="fab fa-facebook-f fa-stack-1x fa-inverse"></i>
                </span> </a></li>
          </ul>
          <ul class="footer-links">
            <li>
              <a href="about.html">About</a>
            </li>
            <li>
              <a href="contact.html">Contact</a>
            </li>
          </ul>
          <p class="copyright text-muted">Copyright &copy; Moral Act 2020</p>
        </div>
      </div>
    </div>
  </footer>
  <script src="assets/vendor/jquery/jquery.min.js"></script>
  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/startbootstrap-clean-blog/js/clean-blog.min.js"></script>
  <script src="assets/scripts.js"></script>
  <script src="assets/vendor/startbootstrap-clean-blog/js/jqBootstrapValidation.js"></script>
  <script>
    $(function () {
      $("#contactForm input,#contactForm textarea").jqBootstrapValidation({
        preventSubmit: true,
        submitError: function ($form, event, errors) {},
        submitSuccess: function ($form, event) {
          event.preventDefault();
          var name = $("input#name").val();
          var email = $("input#email").val();
          var phone = $("input#phone").val();
          var message = $("textarea#message").val();
          var firstName = name;
          if (firstName.indexOf(' ') >= 0) {
            firstName = name.split(' ').slice(0, -1).join(' ');
          }
          $this = $("#sendMessageButton");
          $this.prop("disabled", true);
          $.ajax({
            url: "//formspree.io/your-email@example.com",
            type: "article",
            data: {
              name: name,
              phone: phone,
              email: email,
              message: message
            },
            cache: false,
            success: function () {
              $('#success').html("<div class='alert alert-success'>");
              $('#success > .alert-success').html(
                  "<button type='button' class='close' data-dismiss='alert' aria-hidden='true'>&times;")
                .append("</button>");
              $('#success > .alert-success').append("<strong>Your message has been sent. </strong>");
              $('#success > .alert-success').append('</div>');
              $('#contactForm').trigger("reset");
            },
            error: function () {
              $('#success').html("<div class='alert alert-danger'>");
              $('#success > .alert-danger').html(
                  "<button type='button' class='close' data-dismiss='alert' aria-hidden='true'>&times;")
                .append("</button>");
              $('#success > .alert-danger').append($("<strong>").text("Sorry " + firstName +
                ", it seems that my mail server is not responding. Please try again later!"));
              $('#success > .alert-danger').append('</div>');
              $('#contactForm').trigger("reset");
            },
            complete: function () {
              setTimeout(function () {
                $this.prop("disabled", false);
              }, 1000);
            }
          });
        },
        filter: function () {
          return $(this).is(":visible");
        }
      });
      $("a[data-toggle=\"tab\"]").click(function (e) {
        e.preventDefault();
        $(this).tab("show");
      });
    });
    $('#name').focus(function () {
      $('#success').html('');
    });
  </script>
</body>

</html>
